services:
  watchtower:
    # containrrr/watchtower was archived December 17, 2025 (last release
    # v1.7.1, November 2023) — no security patches or registry API updates.
    # nickfedor/watchtower is the most actively maintained API-compatible
    # fork: regular releases, CI, and the same label/env-var interface.
    # See: https://github.com/nicholas-fedor/watchtower
    image: nickfedor/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: ${WATCHTOWER_SCOPE:-bilinear}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}

  # All three app-tier services share the same image, so watchtower must
  # update them together. Labeling only `app` would recreate it (advancing
  # the schema via `prisma migrate deploy`) while ws/yjs keep stale code —
  # silent sync/protocol skew with no alert.
  app:
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE:-bilinear}"

  ws:
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE:-bilinear}"

  yjs:
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE:-bilinear}"
