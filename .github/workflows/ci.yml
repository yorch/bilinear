name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://ci:ci@invalid.local:5432/ci

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Prisma client
        run: yarn db:generate

      - name: Lint
        run: yarn lint

      - name: Design token check
        run: yarn lint:tokens

      - name: Type check
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

  e2e:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # E2E tests are skipped on fork PRs because they cannot access repository secrets
    # (DATABASE_URL, REDIS_URL, JWT secrets, etc.). The e2e-fork-notice job below
    # provides visibility when this condition causes the job to skip.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    # Use the official Playwright image so chromium/firefox come pre-installed.
    # `playwright install --with-deps` on the bare ubuntu-latest runner hangs
    # reliably during chromium extraction after the download completes; this
    # image bypasses that entirely. Tag is pinned to the @playwright/test
    # version used by the repo.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bilinear_test
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-retries 5
          --health-timeout 5s
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-retries 5
          --health-timeout 5s

    env:
      APP_URL: http://localhost:3000
      # When the job runs in a container, service containers are reachable
      # by their service key name as hostname (not localhost). Port mappings
      # are not needed in this mode.
      DATABASE_URL: postgresql://postgres:password@postgres:5432/bilinear_test
      JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars-long
      JWT_SECRET: test-jwt-secret-min-32-chars-long-here
      REDIS_URL: redis://redis:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Prisma client
        run: yarn prisma generate

      - name: Run database migrations
        run: yarn prisma migrate deploy

      - name: Seed test database
        run: yarn db:seed

      - name: Run E2E tests
        # CI runs chromium only. The Playwright container runs as root with
        # $HOME owned by pwuser; firefox refuses that combo with a sandbox
        # EPERM error. Local `yarn test:e2e` still runs both browsers.
        run: yarn test:e2e --project=chromium

      - name: Upload Playwright report
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-fork-notice:
    # Provides visibility when E2E tests are skipped on fork PRs.
    # This job reports the reason (no access to repository secrets) and succeeds
    # so the workflow completion is not obscured by a skipped check.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Notice E2E skipped on fork PR
        run: |
          echo "ℹ️ E2E tests skipped on fork PRs"
          echo ""
          echo "Fork pull requests cannot access repository secrets needed for E2E:"
          echo "  - DATABASE_URL, REDIS_URL, JWT secrets"
          echo ""
          echo "Before merge, ensure the main branch runs E2E tests successfully."
