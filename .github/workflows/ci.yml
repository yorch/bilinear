name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://ci:ci@invalid.local:5432/ci

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the append-only migration guard diffs against the
          # base branch, which a depth-1 clone does not contain.
          fetch-depth: 0

      # A deployed database records migrations by name, so rewriting one that
      # already shipped changes its contents without changing its name:
      # `prisma migrate deploy` then reports "no pending migrations" and the new
      # DDL never runs. That is exactly how production drifted on 2026-11-25 —
      # the 2026-10-12 database kept the old baseline while `main` carried a
      # regenerated one, so `issue_reminders`, `organization_url_key_aliases`,
      # `webhook_deliveries.error_code` and the `REMINDER` enum value were never
      # created. Migrations are append-only from here on.
      - name: Migrations are append-only
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            git rev-parse --verify --quiet "${base}^{commit}" > /dev/null || base="HEAD~1"
          fi
          changed="$(git diff --diff-filter=MDR --name-only "${base}...HEAD" -- prisma/migrations || true)"
          if [ -n "$changed" ]; then
            # One-time reconciliation (2026-11-25) needed this, and any future
            # rewrite must be just as deliberate: the marker has to be written
            # in the PR body or in one of the branch's commits, and the review
            # sees it. Grepping the whole commit range matters — on a
            # `pull_request` event HEAD is GitHub's synthetic merge commit, and
            # after merging it is the merge commit on `main`; neither carries
            # the author's message.
            marker="$(printf '%s\n%s' "${PR_BODY:-}" "$(git log --pretty=%B "${base}..HEAD")")"
            if printf '%s' "$marker" | grep -qF 'ALLOW-MIGRATION-REWRITE'; then
              echo "::warning::Append-only guard bypassed via ALLOW-MIGRATION-REWRITE in the PR body or commit message."
              echo "Every rewrite must be justified in the PR and recorded in docs/CHANGELOG.md."
              printf '%s\n' "$changed"
              exit 0
            fi
            echo "::error::Existing migrations were edited, renamed or deleted:"
            printf '%s\n' "$changed"
            echo "Deployed databases already recorded them by name, so those edits will never be applied."
            echo "Add a new migration instead — see docs/DATABASE_SCHEMA.md §4."
            exit 1
          fi
          echo "OK — migration chain is append-only relative to ${base}."

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Prisma client
        run: yarn db:generate

      - name: Lint
        run: yarn lint

      - name: Design token check
        run: yarn lint:tokens

      - name: Type check
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

  e2e:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs for fork PRs too: every value this job needs is a literal below
    # (service containers plus throwaway JWT secrets), so there is nothing a
    # fork cannot access. An earlier guard skipped forks citing repository
    # secrets that the job never read, which let 127 e2e tests go unrun on
    # exactly the contributions that need them most.

    # Use the official Playwright image so chromium/firefox come pre-installed.
    # `playwright install --with-deps` on the bare ubuntu-latest runner hangs
    # reliably during chromium extraction after the download completes; this
    # image bypasses that entirely. Tag is pinned to the @playwright/test
    # version used by the repo.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bilinear_test
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-retries 5
          --health-timeout 5s
      redis:
        image: redis:8
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-retries 5
          --health-timeout 5s

    env:
      APP_URL: http://localhost:3000
      # When the job runs in a container, service containers are reachable
      # by their service key name as hostname (not localhost). Port mappings
      # are not needed in this mode.
      DATABASE_URL: postgresql://postgres:password@postgres:5432/bilinear_test
      JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars-long
      JWT_SECRET: test-jwt-secret-min-32-chars-long-here
      REDIS_URL: redis://redis:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Prisma client
        run: yarn prisma generate

      - name: Run database migrations
        run: yarn prisma migrate deploy

      # The custom SQL migration (partial indexes, FTS triggers, the xid8
      # fence) is invisible to `prisma migrate diff`, and a no-op edit to it
      # applies cleanly while doing nothing. This is the one job with a live
      # Postgres, so it is where those verifiers earn their keep.
      #
      # This replaced a gate that had been dead since the Prisma 7 upgrade: it
      # passed `--shadow-database-url`, which Prisma 7 rejects outright, and
      # swallowed the failure with `|| true`. Diffing the migrated database
      # needs no shadow database at all.
      #
      # Exactly two statements are expected — the artifacts of objects the
      # datamodel cannot declare (the xid8 covering index and the pg_trgm title
      # index). Any other statement is real drift.
      - name: Validate schema and check for drift
        run: |
          set -euo pipefail
          yarn prisma validate
          drift="$(yarn prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script)"
          unexpected="$(printf '%s\n' "$drift" \
            | grep -vE '^\s*(--.*)?$' \
            | grep -vE '^DROP INDEX "(idx_issues_title_trgm|sync_actions_organization_id_xact_id_id_idx)";$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::The migrated database does not match schema.prisma:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          echo "OK — the migration chain reproduces schema.prisma (only the two undeclarable indexes differ)."
          yarn db:verify:schema
          yarn db:verify:fence
          yarn db:verify:config

      # The real-Postgres duplicate-suggestion tests skip themselves unless
      # this variable is set, and only this job has a database. They create and
      # delete their own throwaway organization, so they are safe before seeding.
      - name: Duplicate-suggestion tests against real Postgres
        env:
          DUPLICATE_SUGGESTION_TEST_DB: ${{ env.DATABASE_URL }}
        run: yarn vitest run src/server/services/duplicate-suggestion.db.test.ts

      - name: Seed test database
        run: yarn db:seed

      - name: Run E2E tests
        # CI runs chromium only. The Playwright container runs as root with
        # $HOME owned by pwuser; firefox refuses that combo with a sandbox
        # EPERM error. Local `yarn test:e2e` still runs both browsers.
        run: yarn test:e2e --project=chromium

      - name: Upload Playwright report
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
