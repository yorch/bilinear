services:
  app:
    image: ${APP_IMAGE:-ghcr.io/yorch/bilinear:main}
    pull_policy: always
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - ${APP_PORT:-3000}:3000
    env_file:
      - .env
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL_OVERRIDE:-postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-bilinear}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Same-origin path the browser uses to reach the `ws` service below.
      # Read at request time and handed to the client by
      # /api/auth/ws-ticket, so it is configurable without rebuilding the
      # image. Only meaningful when something routes this path to `ws:3001`
      # — docker-compose.traefik.yml does; a bare `prod` deploy without a
      # proxy should set WS_PUBLIC_URL to the published host:port instead.
      WS_PUBLIC_URL: ${WS_PUBLIC_URL:-/ws}
      # Collaborative editing. Both are read at request time (the root layout
      # passes them to CollabProvider), so the feature can be turned on by
      # restarting this container — the NEXT_PUBLIC_* spellings could not,
      # since `next build` inlines those into the published image.
      # Turn on with COLLAB_ENABLED=true AND `--profile collab` (or
      # COMPOSE_PROFILES=collab in .env) so the `yjs` service below runs too.
      COLLAB_ENABLED: ${COLLAB_ENABLED:-false}
      YJS_PUBLIC_URL: ${YJS_PUBLIC_URL:-/collab}

  # Real-time sync fan-out (Redis Pub/Sub -> connected browsers), the webhook
  # retry sweep (every 30s) and cycle auto-rollover all live in this process,
  # NOT in `node server.js`. Without it the app still serves pages but every
  # client's WebSocket connection fails and nothing syncs live.
  ws:
    image: ${APP_IMAGE:-ghcr.io/yorch/bilinear:main}
    pull_policy: always
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The app container owns `prisma migrate deploy` (docker-entrypoint.sh);
    # override it here so the two containers can't race migrations on boot.
    entrypoint: ["node", "./node_modules/tsx/dist/cli.mjs", "src/server/ws/index.ts"]
    # The image's baked-in HEALTHCHECK probes :3000/health (the app's port),
    # but ws listens on :3001. The ws HTTP handler returns 200 for any path,
    # so probe :3001 directly.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    ports:
      - ${WS_PORT_PUBLISHED:-3001}:3001
    env_file:
      - .env
    environment:
      WS_PORT: "3001"
      DATABASE_URL: ${DATABASE_URL_OVERRIDE:-postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-bilinear}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

  # Multi-cursor collaborative editing (Hocuspocus/YJS). Optional and OFF by
  # default — it only runs under the `collab` profile:
  #     docker compose --profile collab -f docker-compose.prod.yml … up -d
  # or COMPOSE_PROFILES=collab in .env. Pair it with COLLAB_ENABLED=true on
  # the app; enabling one without the other is the one way to get a broken
  # editor, so they are documented together in .env.example and the README.
  yjs:
    image: ${APP_IMAGE:-ghcr.io/yorch/bilinear:main}
    pull_policy: always
    restart: unless-stopped
    init: true
    profiles: ["collab"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # As with `ws`: the app container owns `prisma migrate deploy`.
    entrypoint: ["node", "./node_modules/tsx/dist/cli.mjs", "src/server/yjs/index.ts"]
    # The image's baked-in HEALTHCHECK probes :3000/health (the app's port),
    # but yjs listens on :1234 and is a WebSocket-only server (Hocuspocus)
    # with no HTTP endpoint, so an HTTP probe will always fail. Use a TCP
    # connect check instead — it verifies the server is listening.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('net').connect(1234,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));setTimeout(()=>{s.destroy();process.exit(1)},2000)",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    ports:
      - ${YJS_PORT_PUBLISHED:-1234}:1234
    env_file:
      - .env
    environment:
      YJS_PORT: "1234"
      DATABASE_URL: ${DATABASE_URL_OVERRIDE:-postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-bilinear}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
