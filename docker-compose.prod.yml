services:
  app:
    image: ${APP_IMAGE:-ghcr.io/yorch/bilinear:main}
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - ${APP_PORT:-3000}:3000
    env_file:
      - .env
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL_OVERRIDE:-postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-bilinear}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Same-origin path the browser uses to reach the `ws` service below.
      # Read at request time and handed to the client by
      # /api/auth/ws-ticket, so it is configurable without rebuilding the
      # image. Only meaningful when something routes this path to `ws:3001`
      # — docker-compose.traefik.yml does; a bare `prod` deploy without a
      # proxy should set WS_PUBLIC_URL to the published host:port instead.
      WS_PUBLIC_URL: ${WS_PUBLIC_URL:-/ws}

  # Real-time sync fan-out (Redis Pub/Sub -> connected browsers), the webhook
  # retry sweep (every 30s) and cycle auto-rollover all live in this process,
  # NOT in `node server.js`. Without it the app still serves pages but every
  # client's WebSocket connection fails and nothing syncs live.
  ws:
    image: ${APP_IMAGE:-ghcr.io/yorch/bilinear:main}
    pull_policy: always
    restart: unless-stopped
    init: true
    # The app container owns `prisma migrate deploy` (docker-entrypoint.sh);
    # override it here so the two containers can't race migrations on boot.
    entrypoint: ["node", "./node_modules/tsx/dist/cli.mjs", "src/server/ws/index.ts"]
    ports:
      - ${WS_PORT_PUBLISHED:-3001}:3001
    env_file:
      - .env
    environment:
      WS_PORT: "3001"
      DATABASE_URL: ${DATABASE_URL_OVERRIDE:-postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-bilinear}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
