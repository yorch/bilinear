# Overlay for deploying behind an existing Traefik instance.
#   docker compose -f docker-compose.prod.yml -f docker-compose.infra.yml \
#                  -f docker-compose.traefik.yml up -d
#
# Assumes Traefik is already running with an external network named `traefik`
# and a `websecure` entrypoint + `webcert` certificate resolver.
# Set DOMAIN_APP (and rename TRAEFIK_NAME per deployment so router/service
# names stay unique across apps sharing one Traefik).
services:
  app:
    # Reached only via Traefik in this overlay — clear the inherited
    # host port mapping from docker-compose.prod.yml.
    ports: !reset []
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.services.${TRAEFIK_NAME:-bilinear}.loadbalancer.server.port=3000"
      - "traefik.http.routers.${TRAEFIK_NAME:-bilinear}.rule=Host(`${DOMAIN_APP:?DOMAIN_APP must be set when using docker-compose.traefik.yml}`)"
      - "traefik.http.routers.${TRAEFIK_NAME:-bilinear}.entrypoints=websecure"
      - "traefik.http.routers.${TRAEFIK_NAME:-bilinear}.tls=true"
      - "traefik.http.routers.${TRAEFIK_NAME:-bilinear}.tls.certResolver=webcert"
      - "traefik.http.routers.${TRAEFIK_NAME:-bilinear}.service=${TRAEFIK_NAME:-bilinear}"

  # The WS server is routed on the SAME host and the SAME TLS entrypoint as
  # the app, under the `/ws` path, rather than being published on its own
  # port. A browser on an https page can only open `wss://`, and `wss://` to
  # a raw port means that port needs its own TLS listener and certificate —
  # which Traefik's `websecure` entrypoint does not provide. Reusing :443
  # needs neither, and keeps the WS endpoint same-origin.
  #
  # The path is NOT stripped, and does not need to be: the WS server reads
  # only the `token` query parameter and ignores the request path (see
  # src/server/ws/index.ts). `WS_PUBLIC_URL=/ws` on the app service is what
  # tells the browser to connect here.
  ws:
    ports: !reset []
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.services.${TRAEFIK_NAME:-bilinear}-ws.loadbalancer.server.port=3001"
      - "traefik.http.routers.${TRAEFIK_NAME:-bilinear}-ws.rule=Host(`${DOMAIN_APP:?DOMAIN_APP must be set when using docker-compose.traefik.yml}`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.${TRAEFIK_NAME:-bilinear}-ws.entrypoints=websecure"
      - "traefik.http.routers.${TRAEFIK_NAME:-bilinear}-ws.tls=true"
      - "traefik.http.routers.${TRAEFIK_NAME:-bilinear}-ws.tls.certResolver=webcert"
      - "traefik.http.routers.${TRAEFIK_NAME:-bilinear}-ws.service=${TRAEFIK_NAME:-bilinear}-ws"
      # Explicit, so this never depends on Traefik's default rule-length
      # tie-break against the app's catch-all Host() router.
      - "traefik.http.routers.${TRAEFIK_NAME:-bilinear}-ws.priority=100"

  # Collaborative editing, same treatment as `ws` above. Inert unless the
  # `collab` profile is active, since the service itself does not start
  # without it.
  #
  # The prefix must NOT be stripped. Hocuspocus sends the document name
  # in-band rather than in the URL (verified against @hocuspocus/provider:
  # the socket is opened at exactly the configured URL, and the server takes
  # the path only as a peer-grouping namespace), so `/collab` is inherited
  # identically by every client and the document name survives untouched. A
  # stripPrefix middleware here would be harmless but pointless.
  yjs:
    ports: !reset []
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.services.${TRAEFIK_NAME:-bilinear}-yjs.loadbalancer.server.port=1234"
      - "traefik.http.routers.${TRAEFIK_NAME:-bilinear}-yjs.rule=Host(`${DOMAIN_APP:?DOMAIN_APP must be set when using docker-compose.traefik.yml}`) && PathPrefix(`/collab`)"
      - "traefik.http.routers.${TRAEFIK_NAME:-bilinear}-yjs.entrypoints=websecure"
      - "traefik.http.routers.${TRAEFIK_NAME:-bilinear}-yjs.tls=true"
      - "traefik.http.routers.${TRAEFIK_NAME:-bilinear}-yjs.tls.certResolver=webcert"
      - "traefik.http.routers.${TRAEFIK_NAME:-bilinear}-yjs.service=${TRAEFIK_NAME:-bilinear}-yjs"
      - "traefik.http.routers.${TRAEFIK_NAME:-bilinear}-yjs.priority=100"

  postgres:
    networks:
      - default

  redis:
    networks:
      - default

networks:
  traefik:
    external: true
