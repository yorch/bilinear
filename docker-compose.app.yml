services:
  app:
    build:
      context: .
    init: true
    restart: unless-stopped
    ports:
      - ${APP_PORT:-3000}:3000
    env_file:
      - .env
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL_OVERRIDE:-postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-bilinear}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # No reverse proxy in this overlay, so point the browser straight at
      # the published `ws` port below rather than at a same-origin path.
      WS_PUBLIC_URL: ${WS_PUBLIC_URL:-ws://localhost:${WS_PORT_PUBLISHED:-3001}}
      # Same reasoning for collab — no proxy here, so point at the published
      # `yjs` port. Needs `--profile collab` for that service to run.
      COLLAB_ENABLED: ${COLLAB_ENABLED:-false}
      YJS_PUBLIC_URL: ${YJS_PUBLIC_URL:-ws://localhost:${YJS_PORT_PUBLISHED:-1234}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # See docker-compose.prod.yml for why this is a separate process.
  ws:
    build:
      context: .
    init: true
    restart: unless-stopped
    # `prisma migrate deploy` is owned by the app container above.
    entrypoint: ["node", "./node_modules/tsx/dist/cli.mjs", "src/server/ws/index.ts"]
    ports:
      - ${WS_PORT_PUBLISHED:-3001}:3001
    env_file:
      - .env
    environment:
      WS_PORT: "3001"
      DATABASE_URL: ${DATABASE_URL_OVERRIDE:-postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-bilinear}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    # The image's baked-in HEALTHCHECK probes :3000/health (the app's port),
    # but ws listens on :3001. The ws HTTP handler returns 200 for any path,
    # so probe :3001 directly. Matches docker-compose.prod.yml.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # See docker-compose.prod.yml. Only runs under `--profile collab`.
  yjs:
    build:
      context: .
    init: true
    restart: unless-stopped
    profiles: ["collab"]
    entrypoint: ["node", "./node_modules/tsx/dist/cli.mjs", "src/server/yjs/index.ts"]
    ports:
      - ${YJS_PORT_PUBLISHED:-1234}:1234
    env_file:
      - .env
    environment:
      YJS_PORT: "1234"
      DATABASE_URL: ${DATABASE_URL_OVERRIDE:-postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-bilinear}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    # The image's HEALTHCHECK probes :3000/health (the app's port), but yjs
    # listens on :1234 and is a WebSocket-only server (Hocuspocus) with no
    # HTTP endpoint, so an HTTP probe never succeeds. Use a TCP connect check,
    # matching docker-compose.prod.yml.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('net').connect(1234,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));setTimeout(()=>{s.destroy();process.exit(1)},2000)",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
