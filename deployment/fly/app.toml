## Fly.io config for the Next.js application
## https://fly.io/docs/reference/configuration/
##
## Usage:
##   1. Install flyctl and run: fly auth login
##   2. Create the app: fly apps create issue-tracker-app
##   3. Provision Fly Postgres: fly postgres create --name issue-tracker-db
##      Then attach: fly postgres attach issue-tracker-db --app issue-tracker-app
##   4. Add Redis (Upstash): fly ext upstash redis create --app issue-tracker-app
##   5. Set remaining secrets:
##        fly secrets set \
##          JWT_SECRET="$(openssl rand -hex 32)" \
##          JWT_REFRESH_SECRET="$(openssl rand -hex 32)" \
##          APP_URL="https://issue-tracker-app.fly.dev" \
##          NEXT_PUBLIC_WS_URL="wss://issue-tracker-ws.fly.dev" \
##          --app issue-tracker-app
##   6. Deploy: fly deploy -c deployment/fly/app.toml

app = "issue-tracker-app"
primary_region = "iad"

[build]
  dockerfile = "deployment/Dockerfile"
  # No target needed — Dockerfile defaults to the runner (Next.js) stage

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
